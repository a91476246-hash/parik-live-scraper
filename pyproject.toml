[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parik-live-scraper"
version = "0.1.0"
description = "CLI scraper for live football matches from Parik24."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27.0",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.2.0",
  "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
  "types-beautifulsoup4>=4.12.0",
]

[project.scripts]
parik-live = "parik_scraper.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["parik_scraper"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "N"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["RUF001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
